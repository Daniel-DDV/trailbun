[project]
name = "done-is-not-proof"
version = "0.1.0"
description = "Evidence-first checks for reliable AI coding-agent harnesses"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
