name: Tests and distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" build
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps --find-links=dist trailbun==0.2.0
      - run: trailbun --version
      - run: trailbun demo --json
