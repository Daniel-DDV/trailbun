name: Tests and distribution
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra test
      - run: uv run ruff check .
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra test
      - run: uv run pytest -ra --durations=15 -m "not windows_acl" --cov --cov-report=term-missing:skip-covered
      - run: uv build
      - name: Install the wheel in isolation and run the demo
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} wheel-env
          uv pip install --python wheel-env dist/trailbun-*.whl
          uv run --python wheel-env --no-project trailbun --version
          uv run --python wheel-env --no-project trailbun demo --json > demo.json
          uv run --python wheel-env --no-project python -c "import json; assert json.load(open('demo.json'))['status'] == 'ok'"
  windows-acl:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra test
      - run: uv run pytest -ra --durations=15 -m windows_acl
